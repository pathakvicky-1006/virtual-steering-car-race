<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hand Race </title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#050510;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden}
#wrapper{position:relative;width:100vw;max-width:480px}
#gameCanvas{display:block;width:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,16,0.88);transition:opacity .3s}
#overlay.hidden{opacity:0;pointer-events:none}
.ov-title{font-size:clamp(20px,5vw,26px);font-weight:700;color:#fff;letter-spacing:1px;margin-bottom:8px;text-align:center}
.ov-sub{font-size:clamp(12px,3vw,14px);color:rgba(255,255,255,0.6);margin-bottom:20px;text-align:center;padding:0 24px;line-height:1.7}
.ov-btn{padding:13px 38px;border-radius:30px;border:none;background:linear-gradient(135deg,#3498db,#1a6fb0);color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(52,152,219,.4);margin-bottom:10px}
.ov-btn:active{transform:scale(.97)}
.ov-btn2{padding:9px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:13px;cursor:pointer}
.ov-btn2:active{transform:scale(.97)}
.ov-score{font-size:clamp(14px,3.5vw,18px);color:#f1c40f;margin-bottom:4px;font-weight:600}
.ov-best{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:18px}
#cam-box{position:absolute;bottom:10px;right:10px;border-radius:10px;overflow:hidden;border:1.5px solid rgba(52,152,219,.5);background:#000;width:90px;height:68px}
#camVid{display:block;width:90px;height:68px;object-fit:cover}
#camCanvas{position:absolute;top:0;left:0;width:90px;height:68px}
#tilt-wrap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
#tilt-bar{width:130px;height:20px;background:rgba(0,0,0,.5);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.15);position:relative}
#tilt-fill{height:100%;width:50%;background:linear-gradient(90deg,#3498db,#5dade2);border-radius:10px}
#tilt-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#fff;left:50%}
#tilt-label{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.5px}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;pointer-events:none}
.hud-item{background:rgba(0,0,0,.55);border-radius:8px;padding:4px 10px;color:#fff;font-size:clamp(11px,2.5vw,13px);font-weight:600}
.hud-label{color:rgba(255,255,255,.4);font-size:9px;display:block}
#msg-small{position:absolute;top:52px;left:50%;transform:translateX(-50%);color:#f1c40f;font-size:13px;font-weight:600;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#msg-small.show{opacity:1}
#status-bar{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-item"><span class="hud-label">SCORE</span><span id="hScore">0</span></div>
    <div class="hud-item" style="text-align:center"><span class="hud-label">LAP</span><span id="hLap">0/3</span></div>
    <div class="hud-item" style="text-align:right"><span class="hud-label">KM/H</span><span id="hSpeed">0</span></div>
  </div>
  <div id="tilt-wrap">
    <div id="tilt-bar"><div id="tilt-fill"></div><div id="tilt-dot"></div></div>
    <div id="tilt-label">STEERING</div>
  </div>
  <div id="msg-small"></div>
  <div id="status-bar" id="statusBar"></div>
  <div id="cam-box">
    <video id="camVid" autoplay muted playsinline></video>
    <canvas id="camCanvas" width="90" height="68"></canvas>
  </div>
  <div id="overlay">
    <div class="ov-title" id="ovTitle">🏎️ HAND RACE</div>
    <div class="ov-sub" id="ovSub">Loading hand tracking…<br><span style="font-size:11px;opacity:.5">Please wait</span></div>
    <button class="ov-btn" id="ovBtn" style="display:none">▶ Start Race</button>
    <button class="ov-btn2" id="touchBtn" style="display:none">Use Touch Instead</button>
    <div class="ov-score" id="ovScore" style="display:none"></div>
    <div class="ov-best" id="ovBest" style="display:none"></div>
  </div>
</div>

<script>
(function(){
'use strict';

// Canvas
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const W=390,H=680;
canvas.width=W;canvas.height=H;

const camVid=document.getElementById('camVid');
const camCanvas=document.getElementById('camCanvas');
const camCtx=camCanvas.getContext('2d');

// UI
const overlay=document.getElementById('overlay');
const ovTitle=document.getElementById('ovTitle');
const ovSub=document.getElementById('ovSub');
const ovScore=document.getElementById('ovScore');
const ovBest=document.getElementById('ovBest');
const ovBtn=document.getElementById('ovBtn');
const touchBtn=document.getElementById('touchBtn');
const hScore=document.getElementById('hScore');
const hLap=document.getElementById('hLap');
const hSpeed=document.getElementById('hSpeed');
const tiltFill=document.getElementById('tilt-fill');
const tiltDot=document.getElementById('tilt-dot');
const msgSmall=document.getElementById('msg-small');
const statusBar=document.getElementById('status-bar');

// Game state
let state='menu';
let score=0,bestScore=0,lap=0,lapProgress=0;
let raf;
const RW=240,CX=W/2;
const roadL=CX-RW/2,roadR=CX+RW/2;
let roadOff=0;
const CAR={x:CX,y:H-130,w:38,h:66,speed:0};
let enemies=[],coins=[],sparks=[];
let eTimer=0,cTimer=0;
const LANES=[roadL+40,CX,roadR-40];
const LAP_DIST=2200;
const CAR_COLORS=['#e74c3c','#e67e22','#9b59b6','#1abc9c','#e91e63'];

// Hand
let tilt=0,handsReady=false,touchMode=false;

function setStatus(t){statusBar.textContent=t}

function showMsg(t){
  msgSmall.textContent=t;
  msgSmall.classList.add('show');
  setTimeout(()=>msgSmall.classList.remove('show'),1200);
}

// ── Draw ──────────────────────────────────────────────────────────
function drawRoad(){
  ctx.fillStyle='#0c0c22';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0d2b0d';ctx.fillRect(0,0,roadL-6,H);ctx.fillRect(roadR+6,0,W-(roadR+6),H);
  ctx.fillStyle='#1c1c30';ctx.fillRect(roadL,0,RW,H);
  ctx.fillStyle='#c0392b';ctx.fillRect(roadL-6,0,6,H);ctx.fillRect(roadR,0,6,H);
  ctx.save();
  ctx.strokeStyle='rgba(255,220,0,.6)';ctx.lineWidth=3;
  ctx.setLineDash([36,28]);ctx.lineDashOffset=-(roadOff%64);
  ctx.beginPath();ctx.moveTo(CX,0);ctx.lineTo(CX,H);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1.5;
  ctx.setLineDash([20,30]);ctx.lineDashOffset=-(roadOff%50);
  [roadL+RW/3,roadR-RW/3].forEach(lx=>{ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();});
  ctx.restore();
}

function drawCarShape(x,y,w,h,col,isPlayer){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(0,h/2-2,w/2-3,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,[10,10,5,5]);ctx.fill();
  ctx.fillStyle=isPlayer?'#2980b9':'rgba(0,0,0,.3)';
  ctx.beginPath();ctx.roundRect(-w/2+5,-h/2+h*.25,w-10,h*.3,5);ctx.fill();
  ctx.fillStyle=isPlayer?'rgba(130,230,255,.85)':'rgba(60,60,60,.7)';
  ctx.beginPath();ctx.roundRect(-w/2+6,-h/2+7,w-12,h*.22,4);ctx.fill();
  ctx.fillStyle=isPlayer?'#fff':'#aaa';
  [[-w/2+6],[w/2-6]].forEach(([lx])=>{ctx.beginPath();ctx.ellipse(lx,-h/2+5,5,3.5,0,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#f44';
  [[-w/2+6],[w/2-6]].forEach(([lx])=>{ctx.beginPath();ctx.ellipse(lx,h/2-5,4,3,0,0,Math.PI*2);ctx.fill();});
  ctx.restore();
}

function drawCoin(c){
  const sc=Math.abs(Math.cos(c.spin));
  ctx.save();ctx.translate(c.x,c.y);ctx.scale(sc,1);
  const g=ctx.createRadialGradient(0,0,2,0,0,c.r);
  g.addColorStop(0,'#ffe066');g.addColorStop(1,'#e67e00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(-c.r*.25,-c.r*.25,c.r*.35,c.r*.2,-.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSparks(){
  sparks.forEach(s=>{ctx.globalAlpha=s.life;ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(s.x,s.y,4*s.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}

function addSparks(x,y,col,n=16){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*5;sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col});}
}

// ── Update ────────────────────────────────────────────────────────
function resetGame(){
  score=0;lap=0;lapProgress=0;
  CAR.x=CX;CAR.y=H-130;CAR.speed=0;
  enemies=[];coins=[];sparks=[];
  eTimer=0;cTimer=0;roadOff=0;
}

function collide(ax,ay,aw,ah,bx,by,bw,bh){
  return Math.abs(ax-bx)<(aw+bw)/2-6&&Math.abs(ay-by)<(ah+bh)/2-8;
}

function update(){
  const targetX=CX+tilt*(RW/2-CAR.w/2-8);
  CAR.x+=(targetX-CAR.x)*.13;
  CAR.x=Math.max(roadL+CAR.w/2+4,Math.min(roadR-CAR.w/2-4,CAR.x));
  const maxSpd=Math.min(13,7+lapProgress/400+lap*.8);
  CAR.speed+=(maxSpd-CAR.speed)*.02;
  roadOff+=CAR.speed*2.5;lapProgress+=CAR.speed;score+=Math.round(CAR.speed*.07);
  if(lapProgress>=LAP_DIST){
    lapProgress=0;lap++;score+=150;
    showMsg(lap>=3?'🏁 Final Lap!':`✅ Lap ${lap}!`);
    if(lap>=3){setTimeout(()=>endGame(true),800);return;}
  }
  eTimer++;cTimer++;
  const eRate=Math.max(42,95-lapProgress/28-lap*8);
  if(eTimer>=eRate){
    const lane=LANES[Math.floor(Math.random()*3)];
    const col=CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)];
    enemies.push({x:lane,y:-80,w:40,h:66,col,spd:2.5+Math.random()*2.5});
    eTimer=0;
  }
  if(cTimer>=75){
    coins.push({x:LANES[Math.floor(Math.random()*3)],y:-20,r:12,spin:0});
    cTimer=0;
  }
  enemies=enemies.filter(e=>{
    e.y+=e.spd+CAR.speed*.75;
    if(collide(CAR.x,CAR.y,CAR.w,CAR.h,e.x,e.y,e.w,e.h)){addSparks(CAR.x,CAR.y,'#e74c3c');endGame(false);return false;}
    return e.y<H+100;
  });
  coins=coins.filter(c=>{
    c.y+=1.8+CAR.speed*.4;c.spin+=.1;
    if(collide(CAR.x,CAR.y,CAR.w,CAR.h,c.x,c.y,c.r*2,c.r*2)){addSparks(c.x,c.y,'#f1c40f',10);score+=30;showMsg('+30 🪙');return false;}
    return c.y<H+30;
  });
  sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.18;s.life-=.028;return s.life>0;});
  hScore.textContent=score;
  hLap.textContent=`${lap}/3`;
  hSpeed.textContent=Math.round(CAR.speed*14);
  const pct=((tilt+1)/2)*100;
  tiltFill.style.width=pct+'%';
  tiltDot.style.left=pct+'%';
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawRoad();
  coins.forEach(drawCoin);
  enemies.forEach(e=>drawCarShape(e.x,e.y,e.w,e.h,e.col,false));
  drawCarShape(CAR.x,CAR.y,CAR.w,CAR.h,'#3498db',true);
  drawSparks();
  if(CAR.speed>8){ctx.fillStyle=`rgba(52,152,219,${Math.min(.18,(CAR.speed-8)*.04)})`;ctx.fillRect(0,0,W,H);}
}

function loop(){
  if(state!=='running')return;
  update();render();
  raf=requestAnimationFrame(loop);
}

function startGame(){
  resetGame();state='running';
  overlay.classList.add('hidden');
  raf=requestAnimationFrame(loop);
}

function endGame(won){
  if(state!=='running')return;
  state=won?'won':'dead';
  cancelAnimationFrame(raf);render();
  if(score>bestScore)bestScore=score;
  ovTitle.textContent=won?'🏆 Race Complete!':'💥 Crashed!';
  ovSub.textContent=won?'You finished all 3 laps!':'You hit another car!';
  ovScore.textContent=`Score: ${score}`;ovBest.textContent=`Best: ${bestScore}`;
  ovScore.style.display='block';ovBest.style.display='block';
  ovBtn.textContent='▶ Race Again';ovBtn.style.display='block';
  touchBtn.style.display='none';
  overlay.classList.remove('hidden');
}

ovBtn.addEventListener('click',startGame);

// ── Touch fallback ────────────────────────────────────────────────
function enableTouchMode(){
  touchMode=true;handsReady=true;
  document.getElementById('cam-box').style.display='none';
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    const r=canvas.getBoundingClientRect();
    tilt=Math.max(-1,Math.min(1,((e.touches[0].clientX-r.left)/r.width-.5)*2.2));
  },{passive:false});
  canvas.addEventListener('touchstart',e=>{
    const r=canvas.getBoundingClientRect();
    tilt=Math.max(-1,Math.min(1,((e.touches[0].clientX-r.left)/r.width-.5)*2.2));
  });
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    tilt=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2.2));
  });
  ovTitle.textContent='👆 Touch Mode';
  ovSub.textContent='Swipe left/right on screen to steer your car!';
  ovBtn.textContent='▶ Start Race';ovBtn.style.display='block';
  touchBtn.style.display='none';
  setStatus('');
}

touchBtn.addEventListener('click',enableTouchMode);

// ── Camera + MediaPipe ────────────────────────────────────────────
function waitForMediaPipe(cb,attempts=0){
  if(typeof Hands!=='undefined'&&typeof Camera!=='undefined'){cb();return;}
  if(attempts>40){
    // MediaPipe failed to load
    ovTitle.textContent='⚠️ Setup';
    ovSub.textContent='Could not load hand tracking. Use touch mode or check internet.';
    ovBtn.style.display='none';touchBtn.style.display='block';
    setStatus('');return;
  }
  setStatus(`Loading tracking… ${attempts+1}`);
  setTimeout(()=>waitForMediaPipe(cb,attempts+1),300);
}

function startHandTracking(){
  const hands=new Hands({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.5});

  let warmupDone=false;

  hands.onResults(res=>{
    // Mirror draw
    camCtx.save();
    camCtx.translate(90,0);camCtx.scale(-1,1);
    camCtx.drawImage(res.image,0,0,90,68);
    camCtx.restore();

    if(res.multiHandLandmarks&&res.multiHandLandmarks.length>0){
      const lm=res.multiHandLandmarks[0];
      // Draw skeleton (mirrored)
      const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
      camCtx.strokeStyle='#3af';camCtx.lineWidth=1.2;
      CONN.forEach(([a,b])=>{
        const mx=(p)=>90-p.x*90;
        camCtx.beginPath();
        camCtx.moveTo(mx(lm[a]),lm[a].y*68);
        camCtx.lineTo(mx(lm[b]),lm[b].y*68);
        camCtx.stroke();
      });
      lm.forEach(p=>{camCtx.fillStyle='#5df';camCtx.beginPath();camCtx.arc(90-p.x*90,p.y*68,2,0,Math.PI*2);camCtx.fill();});

      // Tilt from wrist(0) to middle MCP(9)
      const w=lm[0],m=lm[9];
      const angle=Math.atan2(m.x-w.x,-(m.y-w.y));
      tilt=Math.max(-1,Math.min(1,angle/(Math.PI/3.2)));

      if(!warmupDone){
        warmupDone=true;handsReady=true;
        ovTitle.textContent='✅ Hand Detected!';
        ovSub.textContent='Tilt hand LEFT or RIGHT to steer.\nAvoid cars · collect coins · 3 laps!';
        ovBtn.style.display='block';touchBtn.style.display='none';
        setStatus('');
      }
    } else {
      tilt*=.88;
      if(warmupDone) setStatus('Show your hand to camera ✋');
      else setStatus('Waiting for hand… ✋');
    }
  });

  const cam=new Camera(camVid,{
    onFrame:async()=>{await hands.send({image:camVid});},
    width:320,height:240
  });
  cam.start().catch(()=>{
    ovTitle.textContent='⚠️ Camera Error';
    ovSub.textContent='Camera could not start. Try touch mode.';
    ovBtn.style.display='none';touchBtn.style.display='block';
    setStatus('');
  });

  setStatus('Warming up… show your hand ✋');
}

function requestCamera(){
  setStatus('Requesting camera…');
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},
    audio:false
  }).then(stream=>{
    camVid.srcObject=stream;
    setStatus('Camera ready, loading model…');
    waitForMediaPipe(startHandTracking);
  }).catch(err=>{
    console.warn('Camera denied:',err);
    ovTitle.textContent='📷 Camera Denied';
    ovSub.textContent='Allow camera permission and reload, or use touch mode.';
    ovBtn.style.display='none';touchBtn.style.display='block';
    setStatus('');
  });
}

// ── Init ──────────────────────────────────────────────────────────
// Initial draw
ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
drawRoad();
drawCarShape(CX,H-130,38,66,'#3498db',true);

// Auto-request camera on load
window.addEventListener('load',()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    enableTouchMode();return;
  }
  // Small delay so page renders first
  setTimeout(requestCamera, 300);
});

})();
</script>

<!-- Load MediaPipe AFTER page so scripts execute in order -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</body>
</html>
